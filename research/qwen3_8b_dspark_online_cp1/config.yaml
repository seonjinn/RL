defaults: ../../examples/configs/recipes/llm/grpo-qwen3-8b-1n8g-megatron-dspark.yaml

grpo:
  seed: 42
  max_num_steps: 1000
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_num_epochs: 1
  val_period: 1000000
  val_at_start: true
  val_at_end: true
  max_val_samples: 4
  val_num_generations_per_prompt: 1
  val_batch_size: 4
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  use_importance_sampling_correction: true

checkpointing:
  enabled: true
  save_period: 100
  checkpoint_must_save_by: 00:03:30:00
  keep_top_k: 3
  save_consolidated: false
  save_optimizer: true
  checkpoint_dir: results/qwen3-8b-dspark-online-cp1

policy:
  max_total_sequence_length: 4096
  train_global_batch_size: 32
  train_micro_batch_size: 1
  logprob_batch_size: 1
  precision: bfloat16
  make_sequence_length_divisible_by: 4
  tokenizer:
    name: Qwen/Qwen3-8B
    chat_template_kwargs:
      enable_thinking: false
  sequence_packing:
    enabled: false
  megatron_cfg:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: false
    use_fused_linear_logprobs: false
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.1
      use_precision_aware_optimizer: false
    scheduler:
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-7
  draft:
    enabled: true
    speculator_type: dspark
    model_name: deepseek-ai/dspark_qwen3_8b_block7
    loss_weight: 1.0
    block_size: 7
    anchors_per_sample: 2
    mask_token_id: 151669
    target_hidden_state_layer_ids: [1, 9, 17, 25, 33]
    num_layers: 5
    draft_vocab_size: null
    markov_rank: 256
    markov_head_type: vanilla
    confidence_enabled: true
    confidence_with_markov: true
    ce_loss_weight: 0.1
    tv_loss_weight: 0.9
    confidence_loss_weight: 1.0
    loss_decay_gamma: 4.0
    seed: 13
    vocab_tile_size: 256
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.1
    update_probe_enabled: true
  generation:
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: 1.0
    val_top_p: 1.0
    val_top_k: null
    vllm_cfg:
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      enforce_eager: false
      precision: bfloat16
      kv_cache_dtype: auto
      gpu_memory_utilization: 0.7
      max_model_len: 4096
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
    vllm_kwargs:
      max_num_seqs: 8
      speculative_config:
        method: dspark
        model: ${policy.draft.model_name}
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 1
        attention_backend: FLASH_ATTN
        rejection_sample_method: standard
        draft_sample_method: greedy
        draft_load_config:
          load_format: auto
      compilation_config:
        mode: 3
        backend: eager
        cudagraph_mode: PIECEWISE
        cudagraph_capture_sizes: [1, 2, 4, 6, 8, 10, 12, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 48, 50, 56, 60, 64, 70, 80, 96, 128, 160, 192, 224, 256, 288, 320]

data:
  max_input_seq_length: 2048
  shuffle: true
  train:
    dataset_name: DAPOMath17K
    split_validation_size: 0.05
    seed: 42
  validation:
    dataset_name: DAPOMathAIME2024

logger:
  log_dir: logs/qwen3-8b-dspark-online-cp1
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: sna-nemo-rl-online-drafter
    group: qwen3-8b-dapomath17k-online-matrix-v1
    name: qwen3-8b-dspark-matrix-template
    tags: [true-online-drafter, dspark, qwen3-8b, matrix, cudagraph, seed42]
    config:
      draft_training_enabled: true
      draft_refit_enabled: true
      training_horizon_steps: 1000
      target_revision: b968826d9c46dd6066d109eabc6255188de91218  # pragma: allowlist secret
      drafter_revision: 03326e5043815da1f81b109078b2889737c26017  # pragma: allowlist secret
      runtime_vllm_version: 0.25.1
      k: 7
      training_tp: 2
      training_dp: 2
      training_pp: 1
      training_cp: 1
      generation_workers: 4
      generation_tp: 1

cluster:
  num_nodes: 1
  gpus_per_node: 4
