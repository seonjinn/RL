defaults: ../../examples/configs/recipes/llm/grpo-qwen3-8b-1n8g-megatron-dflash.yaml

grpo:
  seed: 42
  max_num_steps: 1000
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_num_epochs: 1
  val_period: 1000000
  val_at_start: true
  val_at_end: true
  max_val_samples: 4
  val_num_generations_per_prompt: 1
  val_batch_size: 4
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  use_importance_sampling_correction: true

checkpointing:
  enabled: true
  save_period: 100
  checkpoint_must_save_by: 00:03:30:00
  keep_top_k: 3
  save_consolidated: false
  save_optimizer: true
  checkpoint_dir: results/qwen3-8b-dflash-online-cp1

policy:
  max_total_sequence_length: 4096
  train_global_batch_size: 32
  train_micro_batch_size: 1
  logprob_batch_size: 1
  precision: bfloat16
  make_sequence_length_divisible_by: 4
  tokenizer:
    name: Qwen/Qwen3-8B
    chat_template_kwargs:
      enable_thinking: false
  megatron_cfg:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: false
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.1
      use_precision_aware_optimizer: false
    scheduler:
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-7
  draft:
    enabled: true
    speculator_type: dflash
    model_name: z-lab/Qwen3-8B-DFlash-b16
    loss_weight: 1.0
    gamma: 7
    anchors_per_sample: 2
    mask_token_id: 151669
    target_hidden_state_layer_ids: [1, 9, 17, 25, 33]
    num_layers: 5
    seed: 13
    vocab_tile_size: 256
    position_decay: 1.0
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-6
      weight_decay: 0.1
    update_probe_enabled: true
  generation:
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: 1.0
    val_top_p: 1.0
    val_top_k: null
    vllm_cfg:
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      enforce_eager: false
      precision: bfloat16
      kv_cache_dtype: auto
      gpu_memory_utilization: 0.7
      max_model_len: 4096
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
    vllm_kwargs:
      max_num_seqs: 8
      speculative_config:
        method: dflash
        model: ${policy.draft.model_name}
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 1
        attention_backend: FLASH_ATTN
        rejection_sample_method: standard
        draft_sample_method: greedy
        draft_load_config:
          load_format: auto
      compilation_config:
        mode: 3
        backend: eager
        cudagraph_mode: PIECEWISE
        cudagraph_capture_sizes: [1, 2, 4, 6, 8, 10, 12, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 48, 50, 56, 60, 64, 70, 80, 96, 128, 160, 192, 224, 256, 288, 320]

data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
    seed: 42
  validation:
    dataset_name: DAPOMathAIME2024

logger:
  log_dir: logs/qwen3-8b-dflash-online-cp1
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl-specdec-eval
    group: qwen3-8b-dapomath17k-4k-true-online-dflash-k7-v1
    name: qwen3-8b-dflash-k7-true-online-step1000-seed42
    tags: [true-online-drafter, dflash, qwen3-8b, k7, cudagraph, seed42]
    config:
      oracle_run_id: tbosl9uz
      oracle_url: https://wandb.ai/nvidia/sna-nemo-rl-fixed-drafter/runs/tbosl9uz
      draft_training_enabled: true
      draft_refit_enabled: true
      training_horizon_steps: 1000
      target_revision: b968826d9c46dd6066d109eabc6255188de91218  # pragma: allowlist secret
      drafter_revision: 9b41424b7109f9c5413454f481b09a82b85333f4  # pragma: allowlist secret
      runtime_vllm_version: 0.25.1
      k: 7
      training_tp: 2
      training_dp: 2
      target_tp: 1

cluster:
  num_nodes: 1
  gpus_per_node: 4
