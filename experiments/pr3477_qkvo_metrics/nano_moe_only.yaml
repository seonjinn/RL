defaults: ../../examples/configs/recipes/llm/grpo-nanov3-30BA3B-2n8g-megatron-pack-cp.yaml

checkpointing:
  enabled: false

loss_fn:
  force_on_policy_ratio: false
  use_importance_sampling_correction: true

policy:
  precision: bfloat16
  train_global_batch_size: 16
  generation:
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 4
        gpus_per_node: 4
    vllm_cfg:
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.5
      async_engine: false
      precision: fp8
      is_mx: true
      quantization_ignore_patterns:
        - model.layers.*.mixer.qkv_proj
        - model.layers.*.mixer.o_proj
        - model.layers.*.mixer.in_proj
        - model.layers.*.mixer.out_proj
        - model.layers.*.mixer.up_proj
        - model.layers.*.mixer.down_proj
        - model.layers.*.mixer.gate
        - model.layers.*.mixer.shared_experts.*
        - model.layers.*.mixer.fc1_latent_proj
        - model.layers.*.mixer.fc2_latent_proj
        - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm

logger:
  log_dir: logs/pr3477-qkvo-metrics-nano-moe-only
  wandb_enabled: true
  wandb:
    project: sna-pr3477-qkvo-metrics
    name: nano-moe-only

cluster:
  gpus_per_node: 4
  num_nodes: 8
  segment_size: 4
