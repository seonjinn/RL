defaults: ./qwen35-sync.yaml

policy:
  model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  megatron_cfg:
    bias_activation_fusion: false
    moe_router_dtype: fp32
  generation:
    vllm_cfg:
      quantization_ignore_patterns:
        - "*layers.*.mixer.qkv_proj"
        - "*layers.*.mixer.o_proj"
        - "*layers.*.mixer.in_proj"
        - "*layers.*.mixer.out_proj"
        - "*layers.*.mixer.up_proj"
        - "*layers.*.mixer.down_proj"
        - "*layers.*.mixer.gate"
        - "*layers.*.mixer.shared_experts.*"
        - "*layers.*.mixer.fc1_latent_proj"
        - "*layers.*.mixer.fc2_latent_proj"
        - "*mtp.*"
        - lm_head

logger:
  wandb:
    project: nemo-rl-mxfp8-training-matrix
    name: nano35-sync-mxfp8-train-fp8param-false-mxfp8-rollout
