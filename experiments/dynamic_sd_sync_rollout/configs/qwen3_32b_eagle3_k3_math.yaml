# Validated 2026-07-22 (jobs 2463696/97): 1.27x step-wall (AL 2.82-2.93) vs
# 0.92-0.96x with default captures. 32B runs 256 seqs/engine, so K3 verify
# batches reach 256 x 4 = 1024 tokens - beyond vLLM's default 512 capture cap.
# Captures to 1024 are what flip this model.
cluster: lyris
partition: gb200
venv: /lustre/fsw/coreai_dlalgo_llm/users/sna/venvs/vllm025
env:
  VLLM_USE_V2_MODEL_RUNNER: "1"
  HF_HOME: /lustre/fsw/coreai_dlalgo_llm/users/sna/hf_home

model: Qwen/Qwen3-32B
tensor_parallel_size: 2
gpu_memory_utilization: 0.85
max_model_len: 8192
max_num_seqs: 256
attention_backend: FLASHINFER
disable_custom_all_reduce: true

speculative_config:
  method: eagle3
  model: RedHatAI/Qwen3-32B-Thinking-speculator.eagle3
  num_speculative_tokens: 3
  draft_tensor_parallel_size: 1
  draft_sample_method: greedy

cudagraph_capture_sizes: [1, 2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024]  # covers 256 x (3+1)

# One DP-engine shard of grpo-qwen3-32b-4n4g.yaml (64x32 over 8 TP2 engines)
rollout:
  num_prompts_per_step: 8
  num_generations_per_prompt: 32
  num_steps: 3
  max_tokens: 4096
  temperature: 1.0
  top_p: 1.0
  seed: 42
prompts: vllm-benchmark/data/openmath2_prompts_2048.jsonl  # isl_cap 1024

# NOTE: this gain does NOT transfer to NeMo-RL E2E on the vllm-0.20 container
# (FULL-graph spec verify is a 0.24+/V2 mechanism; measured inert, job 2463893).
# E2E requires the vLLM>=0.24 container rebake.
reproduce: |
  MODEL="Qwen/Qwen3-32B" MODEL_LABEL="qwen3_32b_capfix" TP=2 BENCH=openmath \
  PROMPT_JSONL=<remote>/data/openmath2_prompts_2048.jsonl ISL_CAP=1024 \
  MAX_MODEL_LEN=8192 MAX_NUM_SEQS=256 NUM_PROMPTS_PER_STEP=8 NUM_GENERATIONS_PER_PROMPT=32 NUM_STEPS=3 MAX_TOKENS=4096 \
  PYTHON_BIN=<venv>/bin/python VLLM_USE_V2_MODEL_RUNNER=1 MODE=rollout SPEC_METHOD=eagle3 \
  DRAFT_MODEL=RedHatAI/Qwen3-32B-Thinking-speculator.eagle3 DISABLE_FLASHINFER_AUTOTUNE=true \
  ROLLOUT_VARIANTS=fixed FIXED_K=3 CUDAGRAPH_SIZES="1 2 4 8 12 16 24 32 48 64 96 128 192 256 384 512 768 1024" \
  bash experiments/dynamic_sd_sync_rollout/submit_lyris_dynamic_sd.sh
