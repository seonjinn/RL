# DSpark K8 sync spec arms: cap concurrency at 64 seqs/engine (= 512 rollouts / 8 engines) and
# capture CUDA graphs up to 64 x (K8+1) = 576 verify tokens. The recipe captures only to 32.
# Sizes from 9 up are multiples of K+1 for every request count up to 32 and every even count
# above, so uniform verify batches land on a FULL graph.
policy:
  generation:
    vllm_kwargs:
      max_num_seqs: 64
      compilation_config:
        cudagraph_capture_sizes: [1, 2, 4, 8, 9, 18, 27, 36, 45, 54, 63, 72, 81, 90, 99, 108, 117, 126, 135, 144, 153, 162, 171, 180, 189, 198, 207, 216, 225, 234, 243, 252, 261, 270, 279, 288, 306, 324, 342, 360, 378, 396, 414, 432, 450, 468, 486, 504, 522, 540, 558, 576]