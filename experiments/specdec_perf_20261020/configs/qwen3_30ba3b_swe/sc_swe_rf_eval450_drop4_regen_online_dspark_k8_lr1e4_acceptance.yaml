# Same as sc_swe_rf_eval450_drop4_regen_online_dspark_k8_lr1e4.yaml, but the draft pauses while
# the rollout acceptance length stops improving. SWE steps without drafts give no acceptance
# sample, so max_skip_steps forces a draft update after 4 paused steps.
defaults:
  - sc_swe_rf_eval450_drop4_regen_online_dspark_k8_lr1e4.yaml
  - ../qwen3_30ba3b/draft_update_acceptance.yaml
policy:
  draft:
    update_schedule:
      max_skip_steps: 4