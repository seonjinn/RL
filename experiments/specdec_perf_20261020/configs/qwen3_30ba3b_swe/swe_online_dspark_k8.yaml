# SWE baseline + online DSpark co-training, K=8, refit into vLLM every step. Starts from the
# frozen arm's Thinking drafter, so the delta to swe_frozen_dspark_k8 is the in-domain draft
# training alone. Draft co-training validates only a TP2 training layout, so this arm trains at
# TP2 x EP4 (DP2) on the same node while the baseline and frozen arms train at TP4 x EP4.
# Policy training is about 8% of a baseline step and overlaps rollout in async-1off.
defaults:
  - swe_baseline.yaml
  - ../qwen3_30ba3b/draft_online_dspark_k8.yaml
  - ../qwen3_30ba3b/capture_k8_s128.yaml
policy:
  megatron_cfg:
    tensor_model_parallel_size: 2
  draft:
    model_name: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/sna/modelopt-specdec/assets/thinking-drafters/nemotron-post-v2-b8-s25391/q30-thinking-nemotron-v2-dspark-b8-s25391/exported-checkpoint-25391