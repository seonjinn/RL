env:
  nemo_gym:
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_framework_repo: https://github.com/seonjinn/nv-OpenHands.git
          agent_framework_commit: a8b3da24dfeb9187c14316f259dd69b4bdc0598e