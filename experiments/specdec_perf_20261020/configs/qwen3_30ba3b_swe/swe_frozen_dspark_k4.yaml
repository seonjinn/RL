# 128 seqs/engine, graphs to 640 tokens.
defaults:
  - swe_baseline.yaml
  - spec_frozen_thinking_dspark_k8.yaml
  - ../qwen3_30ba3b/capture_k4_s128.yaml
policy:
  generation:
    vllm_kwargs:
      speculative_config:
        num_speculative_tokens: 4