# Ready-first sampler for the V2 SWE arms. Compose it after single_controller.yaml.
# A step trains on any finished groups, so a slow final eval does not hold the step.
# ready_first needs a real policy ratio, so the loss computes the previous logprobs.
async_rl:
  sampler:
    name: ready_first
    max_staleness_versions: 1
  # ready_first stamps no target step, so the step never gets credit for a skipped
  # prompt and waits on it. The config validator rejects a skip budget for this sampler.
  # Fail on the first dropped prompt. The drop5 data removes the known sandbox failure.
  rollout_failure:
    max_skipped_prompts: 0
loss_fn:
  force_on_policy_ratio: false