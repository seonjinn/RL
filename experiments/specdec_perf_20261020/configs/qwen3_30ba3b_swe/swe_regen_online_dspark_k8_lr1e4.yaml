# SWE baseline + online DSpark co-training from the SWE-regen drafter, K=8, draft lr 1e-4,
# refit into vLLM every step. The delta to swe_regen_frozen_dspark_k8 is the draft training.
# vllm-export-7010 is the Qwen3DSparkModel layout that both Megatron and vLLM load. Training
# must use the same 8192-token window as the checkpoint (vLLM reads it from the checkpoint
# config). The draft build fails if the two windows differ.
defaults:
  - swe_baseline.yaml
  - ../qwen3_30ba3b/draft_online_dspark_k8.yaml
  - ../qwen3_30ba3b/capture_k8_s128.yaml
  - ../qwen3_30ba3b/draft_optim_lr1e4.yaml
policy:
  draft:
    model_name: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/sna/specdec_ptv23/swe_regen_q30t/full/q30t-swe-regen-dspark-rp25swa8k-b8-n32-s7010/vllm-export-7010
    sliding_window: 8192