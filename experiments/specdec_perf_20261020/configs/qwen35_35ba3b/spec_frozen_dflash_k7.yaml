# Frozen DFlash drafter, vLLM speculative_config only, no draft training.
# Drafter: z-lab/Qwen3.5-35B-A3B-DFlash (public, BF16), trained on the Instruct model, so
# acceptance on Base rollouts may be lower. 6 layers (5 SWA 4096 + 1 full), block_size 16,
# target layers [1, 6, 11, 16, 22, 27, 32, 37]. Mixed SWA/full DFlash runs only on Model Runner V2.
# K=7 matches the other DFlash arms and the vLLM validation of this drafter (#47914, AL ~5 @K7).
# vLLM 0.29 lacks the hybrid SpecDec prefix-cache fixes (#53945, #61455), so prefix caching is
# off here. Compare against a control with prefix caching off too.
# vLLM 0.29 picks FLASH_ATTN for the non-causal drafter on SM100 and sizes its pages from the
# target's head_dim 256 (FA4 hd256, page 128). The drafter is head_dim 128 and the hybrid target
# gives it a 1104-token KV block, not a multiple of 128 ("No common block size"). TRITON_ATTN
# takes any multiple of 16 and supports non-causal, SWA and full CUDA graphs.
policy:
  generation:
    vllm_cfg:
      enable_prefix_caching: false
    vllm_kwargs:
      speculative_config:
        method: dflash
        model: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/sna/modelopt-specdec/assets/qwen35-35ba3b/dflash
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 1
        attention_backend: TRITON_ATTN