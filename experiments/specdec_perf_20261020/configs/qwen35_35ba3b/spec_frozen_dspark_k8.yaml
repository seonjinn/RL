# Frozen DSpark drafter, vLLM speculative_config only, no draft training.
# Drafter: jinzex/Qwen3.5-35B-A3B-DSpark (public, BF16), trained on the Instruct model, so
# acceptance on Base rollouts may be lower. 6 SWA 4096 layers, markov rank 256, confidence head on,
# target layers [1, 8, 15, 23, 30, 37]. block_size 8 is read from the checkpoint. K=8 = block_size,
# as for the Q30 and N35 DSpark arms. DSpark runs only on Model Runner V2.
# vLLM 0.29 lacks the hybrid SpecDec prefix-cache fixes (#53945, #61455), so prefix caching is
# off here. Compare against a control with prefix caching off too.
# vLLM 0.29 picks FLASH_ATTN for the non-causal drafter on SM100 and sizes its pages from the
# target's head_dim 256 (FA4 hd256, page 128). The drafter is head_dim 128 and the hybrid target
# gives it a 560-token KV block, not a multiple of 128 ("No common block size"). TRITON_ATTN
# takes any multiple of 16 and supports non-causal, SWA and full CUDA graphs.
policy:
  generation:
    vllm_cfg:
      enable_prefix_caching: false
    vllm_kwargs:
      speculative_config:
        method: dspark
        model: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/sna/modelopt-specdec/assets/qwen35-35ba3b/dspark
        num_speculative_tokens: 8
        draft_tensor_parallel_size: 1
        attention_backend: TRITON_ATTN