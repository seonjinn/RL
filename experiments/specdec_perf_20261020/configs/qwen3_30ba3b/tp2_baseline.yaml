# No-SpecDec baseline at the TP2 training layout of the TP2 online DFlash/DSpark arms.
defaults: ../../../../examples/configs/recipes/llm/performance/grpo-qwen3-30ba3b-4n4g.yaml
checkpointing:
  enabled: false
policy:
  megatron_cfg:
    tensor_model_parallel_size: 2
    expert_tensor_parallel_size: 1
    # EP>1 with TP>1 needs SP, else every TP rank runs the MoE on the full sequence
    sequence_parallel: true