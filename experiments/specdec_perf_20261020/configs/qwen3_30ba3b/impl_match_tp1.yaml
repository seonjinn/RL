# Settings that both draft implementations can express, for a matched draft training cost and
# accept length comparison with the teammate stack (draft_impl_compare_20261021, same file name).
# The teammate draft loss rejects the fused packed loss, so fuse_loss is off. The teammate stack has
# no draft-only warmup, so the global warmup is 0 and the draft trains at its full lr from step 1.
policy:
  sequence_packing:
    fuse_loss: false
  megatron_cfg:
    scheduler:
      lr_warmup_iters: 0
checkpointing:
  enabled: false