# DSpark K8 spec arms: cap concurrency at 256 seqs/engine and capture CUDA graphs up to
# 256 x (K8+1) = 2304 verify tokens, past GB200's default ceiling of 1024. Sizes from 9 up
# are multiples of K+1 for every request count up to 32 and every even count above, so
# uniform verify batches land on a FULL graph.
