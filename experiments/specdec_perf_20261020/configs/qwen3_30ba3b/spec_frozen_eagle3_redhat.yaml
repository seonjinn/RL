# Frozen public EAGLE-3 drafter for Qwen3-30B-A3B (RedHatAI speculators format, no NVIDIA one
# exists for the base model). vLLM speculative_config only, no draft training.
# EAGLE-3 is autoregressive, so K is free; the arms set num_speculative_tokens.
policy:
  generation:
    vllm_kwargs:
      speculative_config:
        method: eagle3
        model: RedHatAI/Qwen3-30B-A3B-speculator.eagle3
        num_speculative_tokens: 3
        draft_tensor_parallel_size: 1