defaults: ./grpo-nanov3-30BA3B-2n8g-megatron-pack-cp.yaml
loss_fn:
  force_on_policy_ratio: false
  use_importance_sampling_correction: true
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-nanov3-30BA3B-2n8g-megatron-pack-cp-mxfp8-rollout
policy:
  train_global_batch_size: 16
  generation:
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.5
      precision: "fp8"
      is_mx: true
      # At TP1, the MXFP8 FlashInfer path pads Nano's MoE intermediate
      # dimension from 1856 -> 1920 for kernel alignment.
      quantization_ignored_layer_kws:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
logger:
  log_dir: logs/grpo-nanov3-30BA3B-2n8g-megatron-pack-cp-mxfp8-rollout
  wandb:
    name: grpo-nanov3-30BA3B-2n8g-megatron-pack-cp-mxfp8-rollout
cluster:
  gpus_per_node: 4
  num_nodes: 4
  segment_size: 4
