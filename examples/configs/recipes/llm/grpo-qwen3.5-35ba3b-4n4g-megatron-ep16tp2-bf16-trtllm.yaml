defaults: grpo-qwen3.5-35ba3b-2n8g-megatron-ep16tp2cp2.yaml

checkpointing:
  checkpoint_dir: results/grpo-qwen3.5-35ba3b-4n4g-megatron-ep16tp2-bf16-trtllm

policy:
  make_sequence_length_divisible_by: 16
  megatron_cfg:
    context_parallel_size: 1
    moe_router_dtype: fp32
    freeze_config:
      freeze_vision_model: true
      freeze_vision_projection: true
      freeze_language_model: false
  generation:
    refit_transport: nccl_reshard
    vllm_cfg:
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.5
      precision: bfloat16
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 4

loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2

logger:
  wandb:
    name: grpo-qwen3.5-35ba3b-4n4g-megatron-ep16tp2-bf16-trtllm

cluster:
  gpus_per_node: 4
  num_nodes: 4
