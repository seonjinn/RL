defaults: ./grpo-qwen3-8b-1n4g-cg.yaml
grpo:
  max_num_steps: 20
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-qwen3-8b-1n4g-cg-pr5672-attn-mlp
policy:
  megatron_cfg:
    cuda_graph_impl: transformer_engine
    cuda_graph_scope:
    - attn
    - mlp
    cuda_graph_warmup_steps: 3
    cuda_graph_packed_seq: true
    cuda_graph_pr5672_thd: true
    cuda_graph_max_packed_seqs: 64
    cuda_graph_buckets:
    - 4096
logger:
  log_dir: logs/grpo-qwen3-8b-1n4g-cg-pr5672-attn-mlp
  wandb:
    name: grpo-qwen3-8b-1n4g-cg-pr5672-attn-mlp
