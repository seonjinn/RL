defaults: ./grpo-qwen3-30ba3b-4n4g.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-4n4g-megatron-mxfp8-cutedsl
policy:
  generation:
    vllm_cfg:
      env_vars:
        VLLM_COMPILE_CACHE_SAVE_FORMAT: unpacked
  megatron_cfg:
    moe_router_dtype: fp32
    use_transformer_engine_op_fuser: true
    moe_mlp_glu_interleave_size: 32
    cuda_graph_impl: none
    cuda_graph_warmup_steps: 3
    cuda_graph_use_single_mempool: true
    fp8_cfg:
      enabled: true
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: false
    env_vars:
      NVTE_CUTEDSL_FUSED_GROUPED_MLP: "1"
logger:
  log_dir: logs/grpo-qwen3-30ba3b-4n4g-megatron-mxfp8-cutedsl
  wandb:
    name: grpo-qwen3-30ba3b-4n4g-megatron-mxfp8-cutedsl
