defaults: ../grpo-nanov3-30BA3B-2n8g-megatron-pack-cp.yaml
loss_fn:
  use_importance_sampling_correction: true
  force_on_policy_ratio: false
checkpointing:
  enabled: false
policy:
  generation:
    vllm_cfg:
      tensor_parallel_size: 1
      precision: fp8
      is_mx: true
      quantization_ignored_layer_kws:
        - lm_head
        - mlp.gate
cluster:
  gpus_per_node: 4
  num_nodes: 4
  segment_size: 4
