defaults: ./grpo-qwen3-30ba3b-4n4g-nocg-w3.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-4n4g-cg-attn-moe-router-w3
policy:
  sequence_packing:
    enabled: true
    train_mb_tokens: 4096
    logprob_mb_tokens: 4096
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64
  megatron_cfg:
    cuda_graph_impl: transformer_engine
    cuda_graph_scope:
    - attn
    - moe_router
    - moe_preprocess
    cuda_graph_warmup_steps: 3
    cuda_graph_packed_seq: true
    # This FP32-router condition is diagnostic only and cannot establish
    # production accuracy. The launcher supplies the FP32 router override.
    cuda_graph_pr5672_thd: true
    cuda_graph_max_packed_seqs: 64
    cuda_graph_buckets:
    - 4096
logger:
  log_dir: logs/grpo-qwen3-30ba3b-4n4g-cg-attn-moe-router-w3
  wandb:
    name: grpo-qwen3-30ba3b-4n4g-cg-attn-moe-router-w3
