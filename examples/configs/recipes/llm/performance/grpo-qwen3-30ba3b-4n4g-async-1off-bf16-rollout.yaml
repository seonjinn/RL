defaults: ./grpo-qwen3-30ba3b-4n4g-async-1off.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-4n4g-async-1off-bf16-rollout
policy:
  megatron_cfg:
    moe_router_dtype: fp32
  generation:
    refit_transport: nccl_reshard
    vllm_cfg:
      precision: bfloat16
      enforce_eager: false
    vllm_kwargs:
      moe_backend: flashinfer_trtllm

loss_fn:
  # Match the MXFP8 rollout performance recipe: compute both policy and
  # reference logprobs instead of forcing the on-policy ratio to one.
  force_on_policy_ratio: false
logger:
  log_dir: logs/grpo-qwen3-30ba3b-4n4g-async-1off-bf16-rollout
  wandb:
    name: grpo-qwen3-30ba3b-4n4g-async-1off-bf16-rollout
