defaults: ./grpo-qwen3-32b-4n4g-nocg.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-32b-4n4g-cg-attn-w6
policy:
  sequence_packing:
    enabled: true
    train_mb_tokens: 4096
    logprob_mb_tokens: 16384
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64
  megatron_cfg:
    cuda_graph_impl: transformer_engine
    cuda_graph_scope: attn
    cuda_graph_warmup_steps: 6
    cuda_graph_packed_seq: true
    cuda_graph_buckets:
    - 4096
logger:
  log_dir: logs/grpo-qwen3-32b-4n4g-cg-attn-w6
  wandb_enabled: true
  tensorboard_enabled: false
  wandb:
    project: nemo-rl-cudagraph
    name: grpo-qwen3-32b-4n4g-cg-attn-w6
