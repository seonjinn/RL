stages:
  - deploy

default:
  image: alpine:3.20

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CLEAN_FLAGS: none

pages:
  stage: deploy
  tags:
    - pages
  timeout: 2h
  script:
    - test -f public/index.html
    - test -f public/reports/vllm_standalone_results_latest.html
    - test -f public/reports/lyris_nemorl_perfcfg_specdec_live_status_latest.html
    - ls -lah public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
