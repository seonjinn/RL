stages:
  - deploy

default:
  image: alpine:3.20

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CLEAN_FLAGS: none

pages:
  stage: deploy
  tags:
    - pages
  timeout: 2h
  script:
    - test -f experiments/eagle3_qwen3_235b/specdec_math_progress_report.html
    - mkdir -p public
    - cp experiments/eagle3_qwen3_235b/specdec_math_progress_report.html public/index.html
    - ls -lah public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
