stages:
  - deploy

default:
  image: alpine:3.20

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CLEAN_FLAGS: none

pages:
  stage: deploy
  tags:
    - pages
  timeout: 2h
  script:
    - test -f public/index.html
    - test -f public/figures/vllm_best_speedup.png
    - test -f public/figures/nemorl_generation_throughput_speedup.png
    - test -f public/reports/vllm_standalone_results_latest.html
    - test -f public/reports/vllm_standalone_results_20260619.html
    - test -f public/reports/vllm_standalone_temp0_temp1_trends_20260616.html
    - test -f public/reports/lyris_nemorl_perfcfg_specdec_live_status_latest.html
    - test -f public/reports/specdec_rl_framework_lessons_and_nemorl_gaps_20260709.html
    - test -f public/reports/qwen235b_specdec_swe_math_status_20260613.html
    - test -f public/reports/specdec_benchmark_metrics_dashboard_20260616.html
    - ls -lah public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
